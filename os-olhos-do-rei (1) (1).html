<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Os Olhos do Rei — Uma Aventura no Império Persa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --bg-deep:#170F26;
  --sand:#D9A566;
  --gold:#E8B94D;
  --lapis:#1F4E79;
  --turquoise:#2E8B8B;
  --terracotta:#B5502D;
  --cream:#F5E6C8;
  --ink:#241226;
  --danger:#B5402D;
  --ok:#3E8E5A;
  --skin:#DDA871;
  --hair:#3A2418;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:radial-gradient(circle at 50% 0%, #2b1c40 0%, var(--bg-deep) 55%, #0d0817 100%);
  font-family:'VT323', monospace;
  color:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:10px;
}

.console{
  width:100%;
  max-width:960px;
  background:linear-gradient(180deg,#3a2a22,#241a16 60%,#180f0c);
  border-radius:24px;
  padding:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 3px #5a4232;
  position:relative;
}
.console:before{
  content:"";
  position:absolute; inset:8px;
  border-radius:16px;
  pointer-events:none;
  background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
  opacity:.12;
}
.screen{
  position:relative;
  background:linear-gradient(180deg,#241832,#150c22);
  border-radius:12px;
  min-height:620px;
  overflow:hidden;
  box-shadow:inset 0 0 0 3px #000, inset 0 0 30px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
}
.screen.shake-screen{animation:screenshake .5s;}
@keyframes screenshake{
  0%,100%{transform:translate(0,0);}
  10%{transform:translate(-6px,2px);}
  20%{transform:translate(6px,-2px);}
  30%{transform:translate(-6px,0);}
  40%{transform:translate(6px,2px);}
  50%{transform:translate(-4px,-2px);}
  60%{transform:translate(4px,2px);}
  70%{transform:translate(-3px,0);}
  80%{transform:translate(3px,1px);}
  90%{transform:translate(-2px,0);}
}
.zigzag{
  height:14px; width:100%;
  background:
    linear-gradient(135deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px,
    linear-gradient(-135deg, var(--gold) 25%, transparent 25%) 0 0/14px 14px,
    var(--terracotta);
  flex-shrink:0;
}

h1,h2,h3{font-family:'Press Start 2P', monospace; line-height:1.6; margin:0 0 12px;}
h1{font-size:22px;color:var(--gold); text-shadow:3px 3px 0 #000;}
h2{font-size:17px;color:var(--turquoise); text-shadow:2px 2px 0 #000;}
h3{font-size:14px;color:var(--sand);}
p,li{font-size:24px;line-height:1.45;}
.eyebrow{font-family:'Press Start 2P';font-size:10px;color:var(--terracotta);letter-spacing:1px;}

.pad{padding:22px;flex:1;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}

button{
  font-family:'VT323', monospace;
  font-size:24px;
  cursor:pointer;
  border:none;
  min-height:48px;
}
.btn{
  background:linear-gradient(180deg,var(--gold),#b8862c);
  color:#241226;
  padding:14px 24px;
  border-radius:12px;
  box-shadow:0 4px 0 #7a5a1c, inset 0 1px 0 rgba(255,255,255,.4);
  font-weight:bold;
  transition:transform .05s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(4px); box-shadow:0 0 0 #7a5a1c;}
.btn.secondary{
  background:linear-gradient(180deg,var(--turquoise),#1c5c5c);
  color:var(--cream);
  box-shadow:0 4px 0 #123f3f, inset 0 1px 0 rgba(255,255,255,.25);
}
.btn.danger{
  background:linear-gradient(180deg,var(--terracotta),#7c351c);
  color:var(--cream);
  box-shadow:0 4px 0 #522514;
}
.btn.giant{font-size:30px;padding:20px 40px;border-radius:16px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;}

.title-screen{align-items:center;justify-content:center;text-align:center;gap:16px;position:relative;}
.logo-wrap{position:relative;}
.crest{
  width:150px;height:150px;margin:0 auto;
  background:radial-gradient(circle at 35% 30%, var(--gold), var(--terracotta) 70%, #6e2c14);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:72px;
  box-shadow:0 0 0 6px #241226, 0 0 0 10px var(--gold), 0 0 40px rgba(232,185,77,.5), 0 12px 30px rgba(0,0,0,.6);
  animation:pulseglow 2.4s infinite ease-in-out;
}
@keyframes pulseglow{
  0%,100%{box-shadow:0 0 0 6px #241226, 0 0 0 10px var(--gold), 0 0 30px rgba(232,185,77,.4), 0 12px 30px rgba(0,0,0,.6);}
  50%{box-shadow:0 0 0 6px #241226, 0 0 0 10px var(--gold), 0 0 55px rgba(232,185,77,.75), 0 12px 30px rgba(0,0,0,.6);}
}
.title-fire{position:relative;height:70px;display:flex;align-items:flex-end;justify-content:center;gap:26px;margin-top:-10px;}
.flame{width:22px;height:38px;background:linear-gradient(180deg,#ffe27a,var(--gold) 40%,var(--terracotta) 80%);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
  filter:drop-shadow(0 0 10px rgba(232,185,77,.8));
  animation:flame-flicker 1s infinite ease-in-out alternate;
  transform-origin:bottom center;}
.flame:nth-child(2){animation-delay:.15s;height:48px;width:26px;}
.flame:nth-child(3){animation-delay:.3s;}
@keyframes flame-flicker{
  0%{transform:scaleY(1) scaleX(1) rotate(-2deg);}
  50%{transform:scaleY(1.15) scaleX(.9) rotate(2deg);}
  100%{transform:scaleY(.92) scaleX(1.05) rotate(-1deg);}
}
.title-walker{position:relative;height:90px;width:100%;overflow:hidden;}
.subtitle{color:var(--sand); font-size:26px;}
.flicker{animation:flicker 1.6s infinite;}
@keyframes flicker{0%,100%{opacity:1;}50%{opacity:.55;}}

/* --- avatar --- */
.avatar-wrap{position:relative;width:140px;height:190px;margin:0 auto;image-rendering:pixelated;--c-skin:var(--skin);--c-hair:var(--hair);}
.av-head{position:absolute;left:38px;top:20px;width:64px;height:60px;border-radius:50%;background:var(--c-skin);box-shadow:inset -6px -6px 0 rgba(0,0,0,.15);z-index:2;}
.av-body{position:absolute;left:16px;top:74px;width:108px;height:104px;z-index:1;
  clip-path:polygon(35% 0%,65% 0%,65% 10%,80% 10%,100% 100%,0% 100%,20% 10%,35% 10%);}
.av-belt{position:absolute;left:16px;top:122px;width:108px;height:14px;background:#241226;z-index:2;}
.av-symbol{position:absolute;left:0;top:86px;width:140px;text-align:center;font-size:24px;z-index:3;}
.av-legs{position:absolute;left:42px;top:172px;width:56px;height:16px;background:#1a1010;z-index:1;clip-path:polygon(0 0,45% 0,45% 100%,0 100%,55% 100%,55% 0,100% 0,100% 100%,0 100%);}
.av-hair{position:absolute;z-index:3;background:var(--c-hair);}
/* hair styles */
.hair-curto-liso .cap{left:32px;top:8px;width:76px;height:36px;border-radius:40px 40px 10px 10px;}
.hair-curto-cacheado .cap{left:30px;top:6px;width:80px;height:40px;border-radius:50%;box-shadow:-14px 10px 0 -6px var(--c-hair),14px 10px 0 -6px var(--c-hair),0 -6px 0 -8px var(--c-hair);}
.hair-medio-liso .cap{left:30px;top:8px;width:80px;height:34px;border-radius:40px 40px 6px 6px;}
.hair-medio-liso .side{left:28px;top:36px;width:14px;height:52px;border-radius:0 0 8px 8px;}
.hair-medio-liso .side2{left:98px;top:36px;width:14px;height:52px;border-radius:0 0 8px 8px;}
.hair-medio-cacheado .cap{left:28px;top:6px;width:84px;height:38px;border-radius:50%;box-shadow:-16px 12px 0 -6px var(--c-hair),16px 12px 0 -6px var(--c-hair);}
.hair-medio-cacheado .side{left:24px;top:32px;width:18px;height:44px;border-radius:50%;}
.hair-medio-cacheado .side2{left:98px;top:32px;width:18px;height:44px;border-radius:50%;}
.hair-longo-liso .cap{left:30px;top:8px;width:80px;height:32px;border-radius:40px 40px 6px 6px;}
.hair-longo-liso .side{left:28px;top:34px;width:16px;height:96px;border-radius:0 0 10px 10px;}
.hair-longo-liso .side2{left:96px;top:34px;width:16px;height:96px;border-radius:0 0 10px 10px;}
.hair-longo-cacheado .cap{left:28px;top:6px;width:84px;height:36px;border-radius:50%;box-shadow:-16px 12px 0 -6px var(--c-hair),16px 12px 0 -6px var(--c-hair);}
.hair-longo-cacheado .side{left:22px;top:30px;width:20px;height:90px;border-radius:50%;box-shadow:0 30px 0 -4px var(--c-hair),0 60px 0 -6px var(--c-hair);}
.hair-longo-cacheado .side2{left:98px;top:30px;width:20px;height:90px;border-radius:50%;box-shadow:0 30px 0 -4px var(--c-hair),0 60px 0 -6px var(--c-hair);}
.hair-trancas .cap{left:32px;top:8px;width:76px;height:30px;border-radius:40px 40px 4px 4px;}
.hair-trancas .side{left:26px;top:30px;width:12px;height:80px;border-radius:6px;}
.hair-trancas .side2{left:102px;top:30px;width:12px;height:80px;border-radius:6px;}
.hair-trancas .tie{left:24px;top:100px;width:16px;height:8px;border-radius:4px;background:var(--gold);}
.hair-trancas .tie2{left:100px;top:100px;width:16px;height:8px;border-radius:4px;background:var(--gold);}
.hair-coque .cap{left:32px;top:10px;width:76px;height:32px;border-radius:40px 40px 6px 6px;}
.hair-coque .bun{left:52px;top:-6px;width:36px;height:36px;border-radius:50%;}

.creator-body{display:flex;gap:24px;flex-wrap:wrap;}
.creator-avatar{flex:0 0 160px;}
.creator-options{flex:1;min-width:240px;display:flex;flex-direction:column;gap:18px;}
.opt-row label{display:block;font-family:'Press Start 2P';font-size:11px;color:var(--turquoise);margin-bottom:8px;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:38px;height:38px;border-radius:8px;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4);}
.swatch.selected{border-color:var(--gold);transform:scale(1.15);}
.symbol-row{display:flex;gap:10px;flex-wrap:wrap;}
.symbol-btn{width:56px;height:56px;font-size:26px;border-radius:10px;background:#2c1f3d;border:2px solid transparent;color:var(--cream);}
.symbol-btn.selected{border-color:var(--gold);background:#3d2a52;}
.hair-row{display:flex;gap:10px;flex-wrap:wrap;}
.hair-btn{padding:10px 12px;border-radius:10px;background:#2c1f3d;border:2px solid transparent;color:var(--cream);font-size:16px;text-align:center;min-width:96px;}
.hair-btn.selected{border-color:var(--gold);background:#3d2a52;}
input[type=text]{
  font-family:'VT323';font-size:24px;padding:12px 14px;border-radius:8px;border:2px solid var(--gold);
  background:#1a1226;color:var(--cream);width:100%;
}

/* HUD */
.hud{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:rgba(0,0,0,.35);border-bottom:2px solid var(--gold);
  font-family:'Press Start 2P';font-size:9px;flex-wrap:wrap;gap:8px;
}
.hud .pill{background:var(--ink);padding:6px 10px;border-radius:8px;border:1px solid var(--gold);white-space:nowrap;}
.xpwrap{flex:1;min-width:130px;display:flex;flex-direction:column;gap:3px;}
.xplabel{font-size:8px;color:var(--sand);}
.progressbar{width:100%;height:10px;background:#000;border-radius:6px;overflow:hidden;border:1px solid var(--gold);}
.progressfill{height:100%;background:linear-gradient(90deg,var(--turquoise),var(--gold));transition:width .4s;}
.hud-btn{font-size:9px;font-family:'Press Start 2P';padding:8px 10px;border-radius:8px;}

.scene-card{
  background:linear-gradient(180deg,#2c1f3d,#1c1328);
  border:2px solid var(--terracotta);
  border-radius:12px;
  padding:18px;
  position:relative;
}
.scene-emoji{font-size:52px;text-align:center;margin-bottom:8px;}
.npc-box{
  margin-top:12px;background:#120b1c;border:2px solid var(--turquoise);border-radius:10px;padding:12px 14px;
}
.npc-name{font-family:'Press Start 2P';font-size:11px;color:var(--gold);margin-bottom:8px;}
.npc-line{min-height:2.6em;}
.npc-line .cursor{animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0;}}

/* --- exploration scene --- */
.explore-wrap{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--terracotta);height:260px;
  cursor:crosshair;touch-action:none;}
.explore-wrap.type-desert,.explore-wrap.type-road,.explore-wrap.type-camp{background:linear-gradient(180deg,#3a2a55 0%,#5c3d2e 55%,#8a6135 100%);}
.explore-wrap.type-market{background:linear-gradient(180deg,#3a2a55 0%,#4a3350 55%,#6b4a3a 100%);}
.explore-wrap.type-palace{background:linear-gradient(180deg,#241832 0%,#3a2650 60%,#4a3260 100%);}
.explore-wrap.type-city{background:linear-gradient(180deg,#2a2040 0%,#3d2e40 55%,#6b5540 100%);}
.explore-wrap.type-river{background:linear-gradient(180deg,#1c3050 0%,#2e5560 55%,#5a7a4a 100%);}
.explore-wrap.type-temple{background:linear-gradient(180deg,#2a1520 0%,#40201c 55%,#5c2a1c 100%);}
.explore-wrap.type-archive{background:linear-gradient(180deg,#241832 0%,#33263f 55%,#3f3020 100%);}
.explore-wrap.type-village{background:linear-gradient(180deg,#243040 0%,#3a4a3a 55%,#6b7a4a 100%);}
.explore-ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(0,0,0,.18);}
.explore-hint{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:15px;color:var(--sand);text-shadow:1px 1px 2px #000;pointer-events:none;}
.exp-avatar{position:absolute;width:52px;height:70px;transform:translate(-50%,-92%);transition:left .5s ease,top .5s ease;z-index:5;pointer-events:none;}
.hotspot-dot{
  position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,185,77,.35),transparent 70%);
  border:2px dashed var(--sand);display:flex;align-items:center;justify-content:center;font-size:24px;
  cursor:pointer;z-index:4;animation:hotspot-pulse 1.8s infinite;
}
@keyframes hotspot-pulse{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.12);}}
.hotspot-dot.correct{border-color:var(--ok);background:radial-gradient(circle,rgba(62,142,90,.5),transparent 70%);animation:none;}
.hotspot-dot.wrong{border-color:var(--danger);background:radial-gradient(circle,rgba(181,64,45,.5),transparent 70%);animation:none;}
.sand-particle{position:absolute;bottom:0;width:3px;height:3px;background:var(--sand);border-radius:50%;opacity:.7;animation:sand-drift linear infinite;}
@keyframes sand-drift{
  0%{transform:translate(0,0);opacity:0;}
  10%{opacity:.8;}
  90%{opacity:.5;}
  100%{transform:translate(120px,-40px);opacity:0;}
}
.mini-fire{position:absolute;bottom:6px;width:16px;height:26px;background:linear-gradient(180deg,#ffe27a,var(--gold) 45%,var(--terracotta) 85%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;filter:drop-shadow(0 0 8px rgba(232,185,77,.7));
  animation:flame-flicker .9s infinite ease-in-out alternate;z-index:3;}
.bird{position:absolute;font-size:16px;animation:bird-fly 6s linear infinite;}
@keyframes bird-fly{0%{transform:translateX(0) translateY(0);}50%{transform:translateX(80px) translateY(-14px);}100%{transform:translateX(160px) translateY(0);}}

.hotspot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px;}
.hotspot{
  background:#241832;border:2px dashed var(--sand);border-radius:10px;padding:16px 10px;text-align:center;
  cursor:pointer;font-size:19px;
}
.hotspot:hover{background:#332246;}
.hotspot.correct{border-color:var(--ok);background:#1c3324;}
.hotspot.wrong{border-color:var(--danger);background:#3a1c1c;}

.q-options{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.q-opt{
  text-align:left;background:#241832;border:2px solid var(--sand);border-radius:10px;padding:14px 16px;color:var(--cream);
  font-size:22px;
}
.q-opt:hover{background:#332246;}
.q-opt.correct{background:#1c3324;border-color:var(--ok);}
.q-opt.wrong{background:#3a1c1c;border-color:var(--danger);}
.q-opt:disabled{cursor:default;}
.explain-box{margin-top:12px;border-left:4px solid var(--ok);padding:12px 14px;background:#182818;border-radius:8px;font-size:20px;}

.match-cols{display:flex;gap:18px;flex-wrap:wrap;}
.match-col{flex:1;min-width:150px;display:flex;flex-direction:column;gap:10px;}
.match-chip{
  background:#241832;border:2px solid var(--sand);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:19px;
}
.match-chip.selected{border-color:var(--gold);background:#3d2a52;}
.match-chip.locked{border-color:var(--ok);background:#1c3324;cursor:default;opacity:.9;}
.match-chip.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

.assign-zone{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;}
.chips{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:180px;}
.chip{background:#3d2a52;border:2px solid var(--gold);border-radius:22px;padding:8px 14px;cursor:pointer;font-size:19px;}
.chip.selected{background:var(--gold);color:#241226;}
.chip.used{opacity:.25;pointer-events:none;}
.targets{display:flex;flex-direction:column;gap:10px;flex:1;min-width:180px;}
.target{
  background:#1c1328;border:2px dashed var(--sand);border-radius:10px;padding:12px;font-size:19px;min-height:20px;
}
.target.filled{border-style:solid;border-color:var(--ok);background:#1c3324;}
.target.wrong-flash{border-color:var(--danger);}

.clue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
.tile{
  aspect-ratio:1;background:#241832;border:2px solid var(--sand);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;
}
.tile.found{background:#1c3324;border-color:var(--ok);cursor:default;}

.modal-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;
  z-index:30; padding:16px;
}
.modal{
  background:linear-gradient(180deg,#2c1f3d,#1c1328);border:3px solid var(--gold);border-radius:14px;
  max-width:560px;width:100%;max-height:82%;overflow-y:auto;padding:20px;
  animation:modal-pop .3s ease;
}
@keyframes modal-pop{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px;}
.inv-item{background:#241832;border:2px solid var(--sand);border-radius:10px;padding:12px;text-align:center;}
.inv-item .ic{font-size:38px;}
.inv-item .nm{font-family:'Press Start 2P';font-size:9px;color:var(--gold);margin:8px 0;}
.inv-item .ds{font-size:16px;color:var(--sand);}
.inv-empty-slot{background:#180f22;border:2px dashed #3a2c4a;border-radius:10px;padding:16px;text-align:center;color:#4a3c5a;font-size:28px;}
.ach-grid{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.ach-item{display:flex;gap:12px;align-items:center;background:#241832;border:2px solid var(--sand);border-radius:10px;padding:10px 12px;}
.ach-item.locked{opacity:.35;}
.ach-item .aic{font-size:30px;}
.ach-item .anm{font-family:'Press Start 2P';font-size:9px;color:var(--gold);margin-bottom:4px;}
.ach-item .ads{font-size:15px;color:var(--sand);}

.reward-banner{
  text-align:center;padding:18px;background:radial-gradient(circle,rgba(232,185,77,.25),transparent 70%);
  border:2px solid var(--gold);border-radius:12px;
}
.glow-gold{animation:goldglow 1.3s infinite ease-in-out;display:inline-block;}
@keyframes goldglow{
  0%,100%{filter:drop-shadow(0 0 4px rgba(232,185,77,.6));transform:scale(1);}
  50%{filter:drop-shadow(0 0 24px rgba(232,185,77,1));transform:scale(1.12);}
}
.act-banner{
  text-align:center;font-family:'Press Start 2P';font-size:12px;color:var(--terracotta);
  padding:8px 0;
}
.final-screen{align-items:center;text-align:center;gap:16px;}
.rank-badge{
  font-family:'Press Start 2P';font-size:15px;color:var(--gold);
  border:2px solid var(--gold);border-radius:12px;padding:14px 18px;

/* ============================================================
   ÁUDIO AMBIENTE (WebAudio, tudo sintetizado)
   ============================================================ */
const Audio2 = {
  ctx:null, master:null, nodes:[], timers:[], noiseBuffer:null, on:true, started:false,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.on ? 0.5 : 0;
      this.master.connect(this.ctx.destination);
      this.noiseBuffer = this.makeNoiseBuffer();
    }catch(e){ this.ctx = null; }
  },
  makeNoiseBuffer(){
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return buf;
  },
  toggle(){
    this.on = !this.on;
    if(this.ctx) this.master.gain.linearRampToValueAtTime(this.on?0.5:0, this.ctx.currentTime+0.2);
    document.getElementById('soundToggle').textContent = this.on ? '🔊' : '🔇';
  },
  clearAll(){
    this.nodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){} });
    this.nodes = [];
    this.timers.forEach(t=>clearInterval(t));
    this.timers = [];
  },
  noiseSource(){
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer; src.loop = true;
    return src;
  },
  wind(){
    if(!this.ctx) return;
    const src = this.noiseSource();
    const filter = this.ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=420;
    const g = this.ctx.createGain(); g.gain.value=0.18;
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start();
    const lfo = this.ctx.createOscillator(); lfo.frequency.value=0.08;
    const lfoGain = this.ctx.createGain(); lfoGain.gain.value=140;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    lfo.start();
    this.nodes.push(src, filter, g, lfo, lfoGain);
  },
  fireBurst(){
    if(!this.ctx) return;
    const src = this.noiseSource();
    const filter = this.ctx.createBiquadFilter();
    filter.type='highpass'; filter.frequency.value=1800+Math.random()*1200;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.10+Math.random()*0.08, this.ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.18);
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start(); src.stop(this.ctx.currentTime+0.2);
  },
  birdChirp(){
    if(!this.ctx) return;
    const o = this.ctx.createOscillator();
    o.type='sine'; o.frequency.value = 1100+Math.random()*700;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.09, this.ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.22);
    o.frequency.exponentialRampToValueAtTime(o.frequency.value*1.4, this.ctx.currentTime+0.18);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime+0.24);
  },
  coinPing(){
    if(!this.ctx) return;
    [1600, 2400].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type='square'; o.frequency.value=f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime+0.01+i*0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.35);
      o.connect(g); g.connect(this.master);
      o.start(); o.stop(this.ctx.currentTime+0.4);
    });
  },
  footstep(){
    if(!this.ctx) return;
    const src = this.noiseSource();
    const filter = this.ctx.createBiquadFilter();
    filter.type='lowpass'; filter.frequency.value=320;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.12, this.ctx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+0.14);
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start(); src.stop(this.ctx.currentTime+0.16);
  },
  marketMurmur(){
    if(!this.ctx) return;
    for(let i=0;i<3;i++){
      const o = this.ctx.createOscillator();
      o.type='triangle'; o.frequency.value = 140+Math.random()*90;
      const g = this.ctx.createGain(); g.gain.value = 0.02;
      o.connect(g); g.connect(this.master);
      o.start();
      const lfo = this.ctx.createOscillator(); lfo.frequency.value=0.15+Math.random()*0.2;
      const lfoGain = this.ctx.createGain(); lfoGain.gain.value=8;
      lfo.connect(lfoGain); lfoGain.connect(o.frequency);
      lfo.start();
      this.nodes.push(o,g,lfo,lfoGain);
    }
  },
  triumphChord(){
    if(!this.ctx) return;
    [261.6,329.6,392,523.2].forEach((f,i)=>{
      const o = this.ctx.createOscillator();
      o.type='sawtooth'; o.frequency.value=f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, this.ctx.currentTime+i*0.08);
      g.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime+i*0.08+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime+2.4);
      o.connect(g); g.connect(this.master);
      o.start(this.ctx.currentTime+i*0.08); o.stop(this.ctx.currentTime+2.5);
    });
  },
  setAmbient(type){
    if(!this.ctx){ this.init(); }
    if(!this.ctx) return;
    this.clearAll();
    const cfg = {
      desert:{wind:true, accents:['fire']},
      camp:{wind:true, accents:['fire']},
      city:{wind:false, accents:['bird','market']},
      river:{wind:false, accents:['bird']},
      road:{wind:true, accents:['footstep']},
      palace:{wind:false, accents:['bird']},
      market:{wind:false, accents:['market','coin']},
      temple:{wind:false, accents:['fire']},
      archive:{wind:false, accents:['coin']},
      village:{wind:true, accents:['footstep','bird']}
    }[type] || {wind:true, accents:['bird']};
    if(cfg.wind) this.wind();
    if(cfg.accents.includes('market')) this.marketMurmur();
    const trigger = ()=>{
      if(!this.on) return;
      cfg.accents.forEach(a=>{
        if(Math.random() < 0.5){
          if(a==='fire') this.fireBurst();
          else if(a==='bird') this.birdChirp();
          else if(a==='coin') this.coinPing();
          else if(a==='footstep') this.footstep();
        }
      });
    };
    const t = setInterval(trigger, 1600);
    this.timers.push(t);
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function addScore(n){ state.score += n; }
function addItem(key){ if(key && !state.inventory.includes(key)) state.inventory.push(key); }
function currentPhase(){ return PHASES[state.phaseIndex]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function getLevel(score){
  let lvl = LEVELS[0];
  for(const l of LEVELS){ if(score >= l.min) lvl = l; }
  return lvl;
}
function getLevelProgress(score){
  const idx = LEVELS.findIndex(l=>l.name===getLevel(score).name);
  const cur = LEVELS[idx];
  const next = LEVELS[idx+1];
  if(!next) return {name:cur.name, pct:100, max:true};
  const pct = Math.min(100, Math.round(((score-cur.min)/(next.min-cur.min))*100));
  return {name:cur.name, pct, max:false};
}

function unlockAchievement(id){
  if(state.achievements.includes(id)) return;
  state.achievements.push(id);
  const a = ACHIEVEMENTS.find(x=>x.id===id);
  if(a) showToast('🏅 ' + a.name);
}

function showToast(text){
  const wrap = document.getElementById('toastWrap');
  if(!wrap) return;
  const t = el(`<div class="toast">${escapeHtml(text)}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2700);
}

function shakeScreen(){
  const s = document.querySelector('.screen');
  if(!s) return;
  s.classList.remove('shake-screen');
  void s.offsetWidth;
  s.classList.add('shake-screen');
}

function playVeilTransition(){
  const s = document.querySelector('.screen');
  if(!s) return;
  const veil = document.getElementById('veil');
  if(!veil) return;
  veil.classList.remove('active');
  void veil.offsetWidth;
  veil.classList.add('active');
}

/* efeito de digitação */
function typeText(elm, text, speed, done){
  elm.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '▌';
  let i = 0;
  const span = document.createElement('span');
  elm.appendChild(span);
  elm.appendChild(cursor);
  const timer = setInterval(()=>{
    span.textContent = text.slice(0, i+1);
    i++;
    if(i >= text.length){
      clearInterval(timer);
      cursor.remove();
      if(done) done();
    }
  }, speed || 18);
  elm._skip = ()=>{
    clearInterval(timer);
    span.textContent = text;
    cursor.remove();
    if(done) done();
  };
  elm.onclick = ()=>{ if(elm._skip) elm._skip(); };
}

}

  screenEl.insertBefore(hud, body);
  hud.querySelector('#invBtn').onclick = ()=>{ state.showInventory = true; render(); };
  hud.querySelector('#achBtn').onclick = ()=>{ state.showAchievements = true; render(); };

  const sub = state.sub;
  if(!sub.stage) sub.stage = pickInitialStage(phase);

  Audio2.setAmbient(phase.type);

  if(sub.stage === 'cinematic') renderCinematic(body, phase);
  else if(sub.stage === 'intro') renderPhaseIntro(body, phase);
  else if(sub.stage === 'minigame') renderMinigame(body, phase);
  else if(sub.stage === 'question') renderQuestion(body, phase);
  else if(sub.stage === 'reward') renderReward(body, phase);
}

function pickInitialStage(phase){
  const cine = CINEMATICS[phase.title];
  if(cine && !state.cinematicsSeen.includes(phase.title)) return 'cinematic';
  return 'intro';
}

/* ============================================================
   CENA CINEMATOGRÁFICA
   ============================================================ */
function renderCinematic(body, phase){
  const cine = CINEMATICS[phase.title];
  body.classList.add('cinematic');
  body.innerHTML = `
    <div class="cine-label">${cine.label}</div>
    <div class="cine-emoji">${cine.emoji}</div>
    <h1>${cine.titleC}</h1>
    <p class="cine-text" id="cineText"></p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn giant" id="cineContinue" style="display:none;">Continuar ▶</button>
    </div>
  `;
  typeText(document.getElementById('cineText'), cine.text, 22, ()=>{
    document.getElementById('cineContinue').style.display='inline-block';
  });
  body.querySelector('#cineContinue').onclick = ()=>{
    state.cinematicsSeen.push(phase.title);
    state.sub.stage = 'intro';
    playVeilTransition();
    render();
  };
}

/* ============================================================
   INTRODUÇÃO DA FASE
   ============================================================ */
function renderPhaseIntro(body, phase){
  body.innerHTML = `
    <div class="act-banner">${phase.act}</div>
    <h2>Fase ${state.phaseIndex+1} — ${phase.title}</h2>
    <div class="scene-card">
      <div class="scene-emoji">${phase.emoji}</div>
      <p><strong>Objetivo:</strong> ${phase.objective}</p>
      <p>${phase.scenario}</p>
      <div class="npc-box">
        <div class="npc-name">${phase.npc.name}</div>
        <p class="npc-line" id="npcLine"></p>
      </div>
    </div>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn giant" id="investigateBtn" style="display:none;">🔎 Explorar</button>
    </div>
  `;
  typeText(document.getElementById('npcLine'), phase.npc.line, 16, ()=>{
    document.getElementById('investigateBtn').style.display='inline-block';
  });
  body.querySelector('#investigateBtn').onclick = ()=>{
    state.sub.stage='minigame';
    playVeilTransition();
    render();
  };
}

/* ============================================================
   MINIJOGOS
   ============================================================ */
function renderMinigame(body, phase){
  if(phase.minigame === 'clue') renderExploreClues(body, phase);
  else if(phase.minigame === 'symbol' || phase.minigame === 'match2') renderMatchGame(body, phase);
  else if(phase.minigame === 'assign') renderAssignGame(body, phase);
  else if(phase.minigame === 'route') renderRouteGame(body, phase);
  else if(phase.minigame === 'hiddenclues') renderHiddenClues(body, phase);
}
function goToQuestion(){ state.sub.stage='question'; playVeilTransition(); render(); }

/* --- exploração livre: andar pela cena e achar a pista --- */
function decorForType(type){
  let html = '<div class="explore-ground"></div>';
  if(['desert','road','camp'].includes(type)){
    for(let i=0;i<14;i++){
      const delay = (Math.random()*4).toFixed(2);
      const dur = (3+Math.random()*3).toFixed(2);
      const bottom = Math.random()*70;
      const left = Math.random()*90;
      html += `<div class="sand-particle" style="left:${left}%;bottom:${bottom}%;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
  }
  if(['temple','camp'].includes(type)){
    html += `<div class="mini-fire" style="left:14%;"></div><div class="mini-fire" style="left:82%;animation-delay:.3s;"></div>`;
  }
  if(['palace','city','river'].includes(type)){
    html += `<div class="bird" style="left:10%;top:14%;">🐦</div><div class="bird" style="left:55%;top:24%;animation-delay:2s;">🐦</div>`;
  }
  return html;
}
function renderExploreClues(body, phase){
  const positions = [ {x:22,y:66}, {x:52,y:44}, {x:80,y:68} ];
  body.innerHTML = `
    <h3>🚶 Ande pela cena e toque no que parece importante</h3>
    <div class="explore-wrap type-${phase.type}" id="expWrap">
      <div class="explore-hint">Toque em um objeto brilhante para examinar</div>
      ${decorForType(phase.type)}
      ${phase.clues.map((c,i)=>`<div class="hotspot-dot" data-i="${i}" style="left:${positions[i%positions.length].x}%;top:${positions[i%positions.length].y}%;" title="${escapeHtml(c)}">✨</div>`).join('')}
      <div class="exp-avatar" id="expAvatar" style="left:50%;top:88%;"></div>
    </div>
    <p id="hMsg" style="min-height:28px;text-align:center;"></p>
  `;
  document.getElementById('expAvatar').innerHTML = avatarHTML(52);
  const wrap = document.getElementById('expWrap');
  const avatar = document.getElementById('expAvatar');

  const moveAvatarTo = (xPct, yPct, cb)=>{
    Audio2.footstep();
    avatar.style.left = xPct+'%';
    avatar.style.top = yPct+'%';
    setTimeout(()=>{ Audio2.footstep(); }, 220);
    if(cb) setTimeout(cb, 520);
  };

  wrap.addEventListener('click', (e)=>{
    if(e.target.classList.contains('hotspot-dot')) return;
    const rect = wrap.getBoundingClientRect();
    const xPct = ((e.clientX - rect.left)/rect.width)*100;
    const yPct = Math.max(55, Math.min(92, ((e.clientY - rect.top)/rect.height)*100));
    moveAvatarTo(xPct, yPct);
  });

  wrap.querySelectorAll('.hotspot-dot').forEach(h=>{
    h.onclick = (e)=>{
      e.stopPropagation();
      const i = parseInt(h.dataset.i);
      const hx = parseFloat(h.style.left);
      const hy = parseFloat(h.style.top);
      wrap.querySelectorAll('.hotspot-dot').forEach(x=>x.style.pointerEvents='none');
      moveAvatarTo(hx, Math.min(92, hy+10), ()=>{
        if(i === phase.clueCorrect){
          h.classList.add('correct');
          document.getElementById('hMsg').textContent = '✅ ' + (phase.foundMsg || 'Pista encontrada!') + ' (+5 pontos)';
          addScore(5);
          shakeScreen();
          showToast('✨ ' + (phase.foundMsg || 'Pista encontrada!'));
          if(!state.achievements.includes('first_clue')) unlockAchievement('first_clue');
          setTimeout(goToQuestion, 750);
        } else {
          h.classList.add('wrong');
          document.getElementById('hMsg').textContent = 'Isso não parece ser a pista certa... procure outro lugar.';
          setTimeout(()=>{
            h.classList.remove('wrong');
            wrap.querySelectorAll('.hotspot-dot').forEach(x=>x.style.pointerEvents='auto');
          }, 900);
        }
      });
    };
  });
}

/* --- jogo de combinação (symbol / match2) --- */
function renderMatchGame(body, phase){
  const sub = state.sub;
  if(!sub.match){
    const symbols = phase.pairs.map((p,i)=>({idx:i, text:p.symbol}));
    const meanings = phase.pairs.map((p,i)=>({idx:i, text:p.meaning}));
    sub.match = { symbols: shuffle(symbols.slice()), meanings: shuffle(meanings.slice()), locked:[], selSym:null };
  }
  const m = sub.match;
  body.innerHTML = `
    <h3>🧩 Ligue cada item ao seu significado</h3>
    <div class="scene-card">
      <div class="match-cols">
        <div class="match-col" id="colSym"></div>
        <div class="match-col" id="colMean"></div>
      </div>
      <p id="mMsg" style="min-height:28px;">Encontrados: ${m.locked.length}/${phase.pairs.length}</p>
    </div>
  `;
  const colSym = body.querySelector('#colSym');
  const colMean = body.querySelector('#colMean');
  m.symbols.forEach(s=>{
    const locked = m.locked.includes(s.idx);
    const chip = el(`<div class="match-chip ${locked?'locked':''} ${m.selSym===s.idx?'selected':''}">${s.text}</div>`);
    if(!locked) chip.onclick = ()=>{ m.selSym = s.idx; renderMatchGame(body, phase); };
    colSym.appendChild(chip);
  });
  m.meanings.forEach(mn=>{
    const locked = m.locked.includes(mn.idx);
    const chip = el(`<div class="match-chip ${locked?'locked':''}">${mn.text}</div>`);
    if(!locked) chip.onclick = ()=>{
      if(m.selSym === null) return;
      if(m.selSym === mn.idx){
        m.locked.push(mn.idx);
        m.selSym = null;
        if(m.locked.length === phase.pairs.length){
          addScore(20);
          showToast('✨ Segredo revelado!');
          setTimeout(goToQuestion, 500);
        }
        renderMatchGame(body, phase);
      } else {
        chip.classList.add('shake');
        setTimeout(()=>chip.classList.remove('shake'), 300);
        m.selSym = null;
      }
    };
    colMean.appendChild(chip);
  });
}

/* --- jogo de posicionar (mapa / tributos) --- */
function renderAssignGame(body, phase){
  const sub = state.sub;
  if(!sub.assign){ sub.assign = { placed:{}, selectedChip:null }; }
  const a = sub.assign;
  const items = phase.items;
  const targets = phase.targets;
  const placedCount = Object.keys(a.placed).length;
  body.innerHTML = `
    <h3>🗂️ Escolha um item e toque no local certo</h3>
    <div class="scene-card">
      <div class="assign-zone">
        <div class="chips" id="chipRow">
          ${items.map((it,i)=>{
            const used = Object.values(a.placed).includes(i);
            return `<button class="chip ${used?'used':''} ${a.selectedChip===i?'selected':''}" data-i="${i}">${it}</button>`;
          }).join('')}
        </div>
        <div class="targets" id="targetCol">
          ${targets.map((t,i)=>{
            const filledIdx = a.placed[i];
            return `<div class="target ${filledIdx!==undefined?'filled':''}" data-t="${i}"><strong>${filledIdx!==undefined? items[filledIdx]+' → ' : ''}</strong>${t}</div>`;
          }).join('')}
        </div>
      </div>
      <p id="aMsg" style="min-height:28px;">Posicionados: ${placedCount}/${items.length}</p>
    </div>
  `;
  body.querySelectorAll('#chipRow .chip').forEach(c=>{
    c.onclick = ()=>{ a.selectedChip = parseInt(c.dataset.i); renderAssignGame(body, phase); };
  });
  body.querySelectorAll('#targetCol .target').forEach(t=>{
    t.onclick = ()=>{
      if(a.selectedChip === null) return;
      const ti = parseInt(t.dataset.t);
      if(a.placed[ti] !== undefined) return;
      if(phase.correctMap[a.selectedChip] === ti){
        a.placed[ti] = a.selectedChip;
        a.selectedChip = null;
        if(Object.keys(a.placed).length === items.length){
          addScore(20);
          showToast('✨ Documento recuperado!');
          document.getElementById('aMsg') && (document.getElementById('aMsg').textContent = '✅ Tudo posicionado! (+20 pontos)');
          setTimeout(goToQuestion, 700);
        }
        renderAssignGame(body, phase);
      } else {
        t.classList.add('wrong-flash');
        body.querySelector('#aMsg').textContent = 'Esse item não é daqui. Tente de novo.';
        setTimeout(()=>t.classList.remove('wrong-flash'), 300);
        a.selectedChip = null;
      }
    };
  });
}

/* --- escolha de rota --- */
function renderRouteGame(body, phase){
  body.innerHTML = `
    <h3>🛣️ Escolha a melhor rota para a mensagem chegar rápido</h3>
    <div class="scene-card">
      <div class="q-options" id="routeOpts">
        ${phase.routes.map((r,i)=>`<button class="q-opt" data-i="${i}">${r.label}</button>`).join('')}
      </div>
      <p id="rMsg" style="min-height:28px;"></p>
    </div>
  `;
  body.querySelectorAll('#routeOpts .q-opt').forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.i);
      const r = phase.routes[i];
      body.querySelectorAll('#routeOpts .q-opt').forEach(x=>x.disabled=true);
      if(r.correct){ b.classList.add('correct'); addScore(20); showToast('✨ Pista encontrada!'); }
      else { b.classList.add('wrong'); }
      body.querySelector('#rMsg').textContent = r.feedback;
      if(r.correct){ setTimeout(goToQuestion, 900); }
      else {
        setTimeout(()=>{
          body.querySelectorAll('#routeOpts .q-opt').forEach(x=>{x.disabled=false; x.classList.remove('wrong');});
          body.querySelector('#rMsg').textContent='';
        }, 1100);
      }
    };
  });
}

/* --- pistas escondidas --- */
function renderHiddenClues(body, phase){
  const sub = state.sub;
  if(!sub.hidden){ sub.hidden = { found: [] }; }
  const h = sub.hidden;
  body.innerHTML = `
    <h3>🕵️ Toque nos pontos que escondem pistas</h3>
    <div class="scene-card">
      <div class="clue-grid" id="cgrid">
        ${Array.from({length:phase.totalTiles}).map((_,i)=>{
          const isClue = phase.clueTiles.includes(i);
          const found = h.found.includes(i);
          return `<div class="tile ${found?'found':''}" data-i="${i}">${found? (isClue?'🔎':'❌') : ''}</div>`;
        }).join('')}
      </div>
      <p id="cMsg" style="min-height:28px;">Pistas encontradas: ${h.found.filter(i=>phase.clueTiles.includes(i)).length}/${phase.clueTiles.length}</p>
    </div>
  `;
  body.querySelectorAll('#cgrid .tile').forEach(t=>{
    t.onclick = ()=>{
      const i = parseInt(t.dataset.i);
      if(h.found.includes(i)) return;
      h.found.push(i);
      const isClue = phase.clueTiles.includes(i);
      if(isClue){ addScore(5); shakeScreen(); showToast('✨ ' + (phase.foundMsg || 'Pista encontrada!')); }
      renderHiddenClues(body, phase);
      const foundClues = h.found.filter(x=>phase.clueTiles.includes(x)).length;
      if(foundClues === phase.clueTiles.length){
        addScore(15);
        document.getElementById('cMsg').textContent = '✅ Todas as pistas foram encontradas! (+20 pontos)';
        setTimeout(goToQuestion, 800);
      }
    };
  });
}

/* ============================================================
   PERGUNTA
   ============================================================ */
function renderQuestion(body, phase){
  const q = phase.question;
  body.innerHTML = `
    <h3>📖 Pergunta do Historiador</h3>
    <div class="scene-card">
      <p>${q.text}</p>
      <div class="q-options" id="qOpts">
        ${q.options.map((o,i)=>`<button class="q-opt" data-i="${i}">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}
      </div>
      <div id="explainBox"></div>
    </div>
    <div class="btn-row" style="justify-content:flex-end;" id="continueRow"></div>
  `;
  const opts = body.querySelectorAll('#qOpts .q-opt');
  opts.forEach(b=>{
    b.onclick = ()=>{
      const i = parseInt(b.dataset.i);
      opts.forEach(x=>x.disabled = true);
      if(i === q.correct){
        b.classList.add('correct');
        addScore(10);
      } else {
        b.classList.add('wrong');
        opts[q.correct].classList.add('correct');
        state.wrongCount++;
      }
      body.querySelector('#explainBox').innerHTML = `<div class="explain-box"><strong>Explicação:</strong> ${q.explain}</div>`;
      const row = body.querySelector('#continueRow');
      row.innerHTML = `<button class="btn giant" id="contBtn">Continuar ▶</button>`;
      row.querySelector('#contBtn').onclick = ()=>{ state.sub.stage='reward'; playVeilTransition(); render(); };
    };
  });
}

/* ============================================================
   RECOMPENSA
   ============================================================ */
function renderReward(body, phase){
  if(phase.reward) addItem(phase.reward);
  const item = phase.reward ? ITEMS[phase.reward] : null;
  const isLast = state.phaseIndex === PHASES.length - 1;
  const prevAct = state.phaseIndex>0 ? PHASES[state.phaseIndex-1].act : null;
  const changingAct = prevAct && prevAct !== phase.act;
  body.innerHTML = `
    <h3>🏆 Fase concluída!</h3>
    <div class="reward-banner">
      ${item ? `<div style="font-size:52px;" class="${item.icon==='🪙'?'coin-shine':''} glow-gold">${item.icon}</div><p><strong>${item.name}</strong> foi para o seu inventário!</p><p style="font-size:19px;color:var(--sand);">${item.desc}</p>` : `<p>Você avançou na investigação! Pontuação atual: ⭐ ${state.score}</p>`}
    </div>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn giant" id="nextBtn">${isLast ? 'Ver Resultado Final ▶' : 'Próxima Fase ▶'}</button>
    </div>
  `;
  checkAchievementsAfterPhase(phase);
  body.querySelector('#nextBtn').onclick = ()=>{
    if(isLast){ state.screen='final'; }
    else { state.phaseIndex++; state.sub={ stage: pickInitialStage(PHASES[state.phaseIndex]) }; }
    playVeilTransition();
    render();
  };
}

function checkAchievementsAfterPhase(phase){
  const isLastOfAct = (state.phaseIndex === PHASES.length-1) || PHASES[state.phaseIndex+1].act !== phase.act;
  if(isLastOfAct){
    if(phase.act.startsWith('Ato I —')) unlockAchievement('act1');
    else if(phase.act.startsWith('Ato II')) unlockAchievement('act2');
    else if(phase.act.startsWith('Ato III')) unlockAchievement('act3');
    else if(phase.act.startsWith('Ato IV')) unlockAchievement('act4');
    else if(phase.act.startsWith('Ato V')) unlockAchievement('act5');
  }
  if(Object.keys(ITEMS).every(k=>state.inventory.includes(k))) unlockAchievement('collector');
  if(state.phaseIndex === PHASES.length-1 && state.wrongCount===0) unlockAchievement('perfect');
}

/* ============================================================
   MODAIS
   ============================================================ */
function renderInventoryModal(screenEl){
  const overlay = el(`<div class="modal-overlay"><div class="modal">
    <h2>🎒 Inventário</h2>
    <p style="font-size:18px;color:var(--sand);">Itens históricos que você já recuperou.</p>
    <div class="inv-grid" id="invGrid"></div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:14px;">
      <button class="btn secondary" id="closeInv">Fechar</button>
    </div>
  </div></div>`);
  const grid = overlay.querySelector('#invGrid');
  Object.keys(ITEMS).forEach(key=>{
    const it = ITEMS[key];
    if(state.inventory.includes(key)){
      grid.appendChild(el(`<div class="inv-item"><div class="ic glow-gold">${it.icon}</div><div class="nm">${it.name}</div><div class="ds">${it.desc}</div></div>`));
    } else {
      grid.appendChild(el(`<div class="inv-empty-slot">?</div>`));
    }
  });
  overlay.querySelector('#closeInv').onclick = ()=>{ state.showInventory = false; render(); };
  screenEl.appendChild(overlay);
}

function renderAchievementsModal(screenEl){
  const overlay = el(`<div class="modal-overlay"><div class="modal">
    <h2>🏅 Conquistas</h2>
    <p style="font-size:18px;color:var(--sand);">Marcos da sua jornada pelo império.</p>
    <div class="ach-grid" id="achGrid"></div>
    <div class="btn-row" style="justify-content:flex-end;margin-top:14px;">
      <button class="btn secondary" id="closeAch">Fechar</button>
    </div>
  </div></div>`);
  const grid = overlay.querySelector('#achGrid');
  ACHIEVEMENTS.forEach(a=>{
    const unlocked = state.achievements.includes(a.id);
    grid.appendChild(el(`<div class="ach-item ${unlocked?'':'locked'}">
      <div class="aic">${unlocked ? a.icon : '❔'}</div>
      <div><div class="anm">${a.name}</div><div class="ads">${a.desc}</div></div>
    </div>`));
  });
  overlay.querySelector('#closeAch').onclick = ()=>{ state.showAchievements = false; render(); };
  screenEl.appendChild(overlay);
}

/* ============================================================
   TELA FINAL
   ============================================================ */
function getRank(score){
  if(score < 100) return 'Aprendiz da História';
  if(score < 200) return 'Escriba Real';
  if(score < 280) return 'Guardião das Satrapias';
  if(score < 350) return 'Olhos do Rei';
  return 'Mestre do Império Persa';
}
function renderFinal(body){
  body.classList.add('final-screen');
  const rank = getRank(state.score);
  body.innerHTML = `
    <div class="eyebrow">MISTÉRIO RESOLVIDO</div>
    <div class="explore-wrap type-palace" style="height:170px;width:100%;max-width:520px;">
      ${decorForType('palace')}
      <div class="mini-fire" style="left:20%;"></div>
      <div class="mini-fire" style="left:75%;animation-delay:.4s;"></div>
      <div class="scene-emoji" style="position:absolute;top:30%;left:0;right:0;">🏛️✨</div>
    </div>
    <h1>PERSÉPOLIS EM PAZ</h1>
    <p>Graças à sua investigação, ${escapeHtml(state.player.name)}, a verdade veio à tona e a justiça voltou a reinar em nome do Grande Rei.</p>
    <div class="rank-badge">⭐ ${state.score} pontos<br>Título: ${rank}</div>
    <div class="scene-card" style="text-align:left;max-width:560px;">
      <h3>📜 O que você descobriu nesta jornada:</h3>
      <ul class="summary-list">
        <li>Ciro uniu medos e persas em 550 a.C. e fundou o Império Persa.</li>
        <li>Cambises conquistou o Egito, deixando o território ainda maior.</li>
        <li>Dario organizou a administração do império em satrapias.</li>
        <li>O império respeitava os costumes e religiões dos povos conquistados.</li>
        <li>As satrapias e a Estrada Real fortaleceram o governo e a comunicação.</li>
        <li>Os inspetores, "Olhos e Ouvidos do Rei", fiscalizavam os governadores.</li>
        <li>O zoroastrismo valorizava a verdade e as boas ações.</li>
      </ul>
    </div>
    <p style="font-family:'Press Start 2P';font-size:12px;color:var(--gold);text-shadow:2px 2px 0 #000;">"A verdade protege o império."</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn secondary" id="achBtnFinal">🏅 Conquistas</button>
      <button class="btn secondary" id="invBtnFinal">🎒 Inventário</button>
      <button class="btn giant" id="restartBtn">🔄 Jogar Novamente</button>
    </div>
  `;
  Audio2.clearAll();
  Audio2.init();
  Audio2.triumphChord();
  body.querySelector('#invBtnFinal').onclick = ()=>{ state.showInventory = true; render(); };
  body.querySelector('#achBtnFinal').onclick = ()=>{ state.showAchievements = true; render(); };
  body.querySelector('#restartBtn').onclick = ()=>{
    Audio2.clearAll();
    state = {
      screen:'title',
      player:{ name:'', hair:HAIRSTYLES[0].key, tunic:COLORS.tunic[0], symbol:SYMBOLS[0] },
      phaseIndex:0, score:0, wrongCount:0, inventory:[], achievements:[], cinematicsSeen:[],
      sub:{}, showInventory:false, showAchievements:false
    };
    render();
  };
}

render();
